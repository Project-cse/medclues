# Render Blueprint — FastAPI backend (matches local: uvicorn main:app --port 5000)
# Dashboard: connect repo → rootDir fastapi_back, or use this file via Blueprint sync.

services:
  - type: web
    name: medclues-api
    runtime: python
    rootDir: fastapi_back
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: 5000
      - key: DEBUG
        value: "false"
      # Set in Render Dashboard (never commit secrets):
      # DATABASE_URL, JWT_SECRET (32+ chars), CORS_ALLOWED_ORIGINS,
      # CLOUDINARY_*, RAZORPAY_*, BREVO/SMTP, AGORA_*, TELEGRAM_BOT_*
